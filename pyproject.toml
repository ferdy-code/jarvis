[project]
name = "jarvis"
version = "0.1.0"
description = "A local voice and text assistant for Windows, in English and Indonesian."
readme = "README.md"
authors = [
    { name = "Ferdy PC", email = "mferdy@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "openai>=3.28.0",
    "openwakeword>=0.4.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "sounddevice>=0.5.6",
    "supertonic>=1.3.1",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
